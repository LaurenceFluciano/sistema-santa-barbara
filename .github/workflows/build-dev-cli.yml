name: Build Cross-Platform dev-cli Executables

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build para ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            output_name: dev-cli-linux
          - os: windows-latest
            target: windows
            output_name: dev-cli-windows.exe
          - os: macos-latest
            target: macos
            output_name: dev-cli-macos

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Compilar com PyInstaller (Linux/Mac)
        if: matrix.os != 'windows-latest'
        run: |
          cd scripts
          pyinstaller --onefile --name ${{ matrix.output_name }} dev-cli.py

      - name: Compilar com PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd scripts
          pyinstaller --onefile --name ${{ matrix.output_name }} dev-cli.py

      - name: Salvar Executável como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: scripts/dist/${{ matrix.output_name }}*